tio:9/20;background:#fff;border:7px solid #222c43;border-radius:34px;box-shadow:0 25px 80px #0009;position:relative;overflow:hidden;touch-action:none}.phone.preview{border-color:var(--cyan)}.phone-screen{position:absolute;inset:0;background:#fff;overflow:hidden}.canvas-item{position:absolute;display:flex;align-items:center;justify-content:center;user-select:none;touch-action:none;cursor:move;overflow:hidden}.canvas-item.selected{outline:2px dashed #786cff;outline-offset:2px;z-index:2;overflow:visible}.canvas-item.selected img,.canvas-item.selected input{position:relative;z-index:1}.canvas-item.moving .resize-handle{display:none!important}.canvas-item .item-label{pointer-events:none}.canvas-item input{width:100%;height:100%;border:1px solid #cbd5e1;border-radius:7px;padding:8px;font-size:16px;outline:none;touch-action:auto}.canvas-item input{pointer-events:none}.phone.preview .canvas-item input{pointer-events:auto}.canvas-item img{width:100%;height:100%;object-fit:fill;pointer-events:none}.resize-handle{position:absolute;width:24px;height:24px;background:#fff;border:2px solid #7464ff;border-radius:50%;z-index:12;touch-action:none;box-shadow:0 1px 5px #0009;display:block;pointer-events:auto}.resize-handle:after{content:'';position:absolute;inset:5px;background:#7464ff;border-radius:50%}.resize-handle[data-dir="n"]{top:-6px;left:calc(50% - 6px);cursor:ns-resize}.resize-handle[data-dir="s"]{bottom:-6px;left:calc(50% - 6px);cursor:ns-resize}.resize-handle[data-dir="e"]{right:-6px;top:calc(50% - 6px);cursor:ew-resize}.resize-handle[data-dir="w"]{left:-6px;top:calc(50% - 6px);cursor:ew-resize}.resize-handle[data-dir="ne"]{right:-6px;top:-6px;cursor:nesw-resize}.resize-handle[data-dir="nw"]{left:-6px;top:-6px;cursor:nwse-resize}.resize-handle[data-dir="se"]{right:-6px;bottom:-6px;cursor:nwse-resize}.resize-handle[data-dir="sw"]{left:-6px;bottom:-6px;cursor:nesw-resize}.canvas-item button{width:100%;height:100%;border:0;border-radius:inherit;background:transparent;color:inhe </style></head><body><div class="app"><header class="top"><div class="brand">App<b>Lab</b></div><input id="projectName" class="project-name" value="Meu app" aria-label="Nome do projeto"><div class="grow"></div><button id="previewBtn">▶ Prévia</button><button id="saveBtn" class="save">✓ Salvo</button><button id="importBtn">Abrir projeto</button><button id="exportBtn">Exportar</button></header><main class="body"><aside class="left"><button id="buildDemo" class="primary" style="width:100%;margin:2px 0 12px">✨ Montar tela da imagem</button><div class="section-title">Adicionar elementos</div><div class="tools" id="tools"></div><div class="section-title" style="margin-top:22px">Telas do app</div><div class="screens" id="screens"></div><button class="small" id="addScreen" style="width:100%;margin-top:8px">＋ Nova tela</button><p class="hint">Arraste os elementos na tela do celular. Toque em um elemento para editar suas propriedades.</p></aside><section class="stage"><div class="phone" id="phone"><button id="previewExit" class="preview-exit hidden" aria-label="Sair da prévia">✕ Sair</button><div class="phone-screen" id="canvas"></div></div></section><aside class="right" id="properties"><div class="section-title">Propriedades</div><div id="propsContent" class="hint">Selecione um elemento para editar.</div></aside></main><nav class="bottom-mobile"><button id="mobileAdd">＋ Elementos</button><button id="mobileScreens">▣ Telas</button><button id="mobileProps">⚙ Editar</button><button id="mobilePreview">▶ Prévia</button></nav><div id="drawer" class="drawer hidden"></div><input class="file-input" id="imagePicker" type="file" accept="image/*"><input class="file-input" id="importPicker" type="file" accept="application/json,.json"><div id="toast" class="toast hidden"></div><div id="itemMenu" class="item-menu hidden"></div></div>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);const types=[['button','▣','Botão'],['text','T','Texto'],['rect','▰','Retângulo'],['square','◼','Quadrado'],['circle','●','Círculo'],['image','▧','Imagem'],['input','▤','Input'],['money','＄','Input de valor'],['numeric','123','Input numérico centralizado'],['moneycenter','＄','Input de valor centralizado']];let data={name:'Meu app',active:'s1',sharedValues:{},screens:[{id:'s1',name:'Tela 1',items:[]} ]},selected=null,preview=false,drawerMode='';let pendingImage=false;const canvas=$('#canvas'),phone=$('#phone');
function save(){data.name=$('#projectName').value||'Meu app';try{localStorage.setItem('applab-project',JSON.stringify(data));$('#saveBtn').textContent='✓ Salvo'}catch(e){$('#saveBtn').textContent='Não salvo';showToast('Sem espaço para salvar. Exporte o projeto.')};}
function load(){try{let d=JSON.parse(localStorage.getItem('applab-project'));if(d?.screens?.length){data=d;data.sharedValues=data.sharedValues||{};data.screens.forEach(s=>s.items.forEach(it=>{if(it.type==='input'&&!it.sharedKey)it.sharedKey=it.id}))}}catch(e){}$('#projectName').value=data.name||'Meu app';}
function appendMoneyDigit(current,digit){let d=String(current||'0').replace(/\D/g,'').replace(/^0+(?=\d)/,'');d=(d==='0'?'':d)+digit;return d.replace(/^0+(?=\d)/,'')||'0'}function formatMoneyDigits(digits){let d=String(digits||'0').replace(/\D/g,'').replace(/^0+(?=\d)/,'')||'0';let n=Number(d);if(!Number.isFinite(n))n=0;return (n/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}function setMoneyValue(it,key,digits){digits=String(digits||'0').replace(/\D/g,'').replace(/^0+(?=\d)/,'')||'0';it.moneyDigits=digits;let value=formatMoneyDigits(digits);it.value=value;data.sharedValues[key]=digits;data.screens.forEach(sc=>sc.items.forEach(other=>{if(['input','money','numeric','moneycenter'].includes(other.type)&&(other.sharedKey||other.id)===key){other.value=value;other.moneyDigits=digits}}));save()}function cur(){return data.screens.find(s=>s.id===data.active)||data.screens[0]}function itemById(id){return cur().items.find(x=>x.id===id)}
function showToast(t){let el=$('#toast');el.textContent=t;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),1800)}
function renderTools(el){el.innerHTML='';types.forEach(([type,icon,name])=>{let b=document.createElement('button');b.className='tool';b.innerHTML=`<span>${icon}</span>${name}`;b.onclick=()=>add(type);el.append(b)});let b=document.createElement('button');b.className='tool';b.innerHTML='<span>＋</span>Nova tela';b.onclick=addScreen;el.append(b)}
function renderScreens(root){root.innerHTML='';data.screens.forEach((s,i)=>{let row=document.createElement('div');row.className='screen-row';let b=document.createElement('button');b.className='screen-btn'+(s.id===data.active?' active':'');b.textContent=`${i+1}. ${s.name}`;b.onclick=()=>{data.active=s.id;selected=null;render();$('#drawer').classList.add('hidden')};row.append(b);if(data.screens.length>1){let del=document.createElement('button');del.className='small danger';del.textContent='×';del.title='Apagar tela';del.onclick=()=>{if(confirm(`Apagar “${s.name}”?`)){data.screens=data.screens.filter(x=>x.id!==s.id);data.active=data.screens[0].id;selected=null;render();save();if(drawerMode==='screens')openDrawer('screens')}};row.append(del)}root.append(row)})}
function render(skipProps=false){renderScreens($('#screens'));canvas.innerHTML='';let s=cur();if(!s.items.length){let e=document.createElement('div');e.className='empty';e.innerHTML='<strong>Sua tela começa aqui</strong><span>Adicione um elemento e arraste para posicionar.</span>';canvas.append(e)}s.items.forEach(it=>{let el=document.createElement('div');el.className='canvas-item'+(selected===it.id&&!preview?' selected':'');el.dataset.id=it.id;el.style.left=it.x+'%';el.style.top=it.y+'%';el.style.width=it.w+'%';el.style.height=it.h+'%';el.style.background=((it.type==='button'&&it.invisible)||(['input','money','numeric','moneycenter'].includes(it.type)&&it.inputTransparent))?'transparent':it.color;el.style.borderRadius=it.type==='square'?'8px':(it.type==='circle'?'50%':it.radius+'px');el.style.color=it.textColor||'#fff';el.style.opacity=it.opacity;el.style.fontSize=it.fontSize+'px';el.style.textAlign=it.align||'center';el.style.justifyContent=it.align==='left'?'flex-start':(it.align==='right'?'flex-end':'center');el.style.padding=it.type==='text'?'0 2px':'0';el.style.border=(['input','money','numeric','moneycenter'].includes(it.type))?'none':`${it.borderWidth||0}px solid ${it.borderColor||it.color}`;if(it.type==='image'){let im=document.createElement('img');im.src=it.src||'';el.append(im)}else if(it.type==='input'||it.type==='money'||it.type==='numeric'||it.type==='moneycenter'){let inp=document.createElement('input');let key=it.sharedKey||it.id;inp.placeholder=(it.type==='money'||it.type==='moneycenter')?'0,00':(it.placeholder||'Digite aqui');inp.readOnly=!!it.locked;if(it.type==='numeric'){inp.inputMode='numeric';inp.autocomplete='off';inp.value=(data.sharedValues[key]!==undefined)?data.sharedValues[key]:(it.value||'');inp.style.textAlign='center';inp.oninput=()=>{let val=inp.value.replace(/\D/g,'');inp.value=val;it.value=val;data.sharedValues[key]=val;data.screens.forEach(sc=>sc.items.forEach(other=>{if(['input','money','numeric','moneycenter'].includes(other.type)&&(other.sharedKey||other.id)===key)other.value=val}));save()};inp.onkeydown=e=>{if(e.key.length===1&&!/\d/.test(e.key)&&!e.ctrlKey&&!e.metaKey)e.preventDefault()}}else if(it.type==='money'||it.type==='moneycenter'){if(it.type==='moneycenter')inp.style.textAlign='center';let digits=String(data.sharedValues[key]??it.moneyDigits??'0');inp.value=formatMoneyDigits(digits);inp.inputMode='numeric';let moneyKey=e=>{if(it.locked)return;if(/^\d$/.test(e.key)){e.preventDefault();digits=appendMoneyDigit(digits,e.key);setMoneyValue(it,key,digits);inp.value=formatMoneyDigits(digits)}else if(e.key==='Backspace'){e.preventDefault();digits=String(digits||'0').slice(0,-1)||'0';setMoneyValue(it,key,digits);inp.value=formatMoneyDigits(digits)}else if(e.key==='Delete'){e.preventDefault();digits='0';setMoneyValue(it,key,digits);inp.value=formatMoneyDigits(digits)}else if(e.key.length===1&&!['Tab'].includes(e.key))e.preventDefault()};inp.onkeydown=moneyKey;inp.onbeforeinput=e=>{if(it.locked)return;e.preventDefault();if(e.inputType==='deleteContentBackward'){digits=String(digits||'0').slice(0,-1)||'0'}else if(e.inputType==='deleteContentForward'){digits='0'}else if(e.data&&/^\d+$/.test(e.data)){for(const c of e.data)digits=appendMoneyDigit(digits,c)}setMoneyValue(it,key,digits);inp.value=formatMoneyDigits(digits)};inp.oninput=()=>{inp.value=formatMoneyDigits(digits)};inp.onclick=()=>{try{inp.setSelectionRange(inp.value.length,inp.value.length)}catch(e){}}}else{inp.value=(it.value!==undefined&&it.value!=='')?it.value:((it.sharedKey&&data.sharedValues[it.sharedKey]!==undefined)?data.sharedValues[it.sharedKey]:'');inp.oninput=()=>{let val=inp.value,key=it.sharedKey||it.id;it.value=val;data.sharedValues[key]=val;data.screens.forEach(sc=>sc.items.forEach(other=>{if(['input','money','numeric','moneycenter'].includes(other.type)&&(other.sharedKey||other.id)===key)other.value=val}));save()}}inp.style.background=it.inputTransparent?'transparent':(it.color||'#fff');inp.style.color=it.textColor||'#
