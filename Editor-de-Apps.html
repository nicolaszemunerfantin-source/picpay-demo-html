<script>
(()=>{'use strict';const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);const types=[['button','▣','Botão'],['rect','▰','Retângulo'],['square','◼','Quadrado'],['image','▧','Imagem'],['input','▤','Input']];let data={name:'Meu app',active:'s1',sharedValues:{},screens:[{id:'s1',name:'Tela 1',items:[]} ]},selected=null,preview=false,drawerMode='';let pendingImage=false;const canvas=$('#canvas'),phone=$('#phone');
function save(){data.name=$('#projectName').value||'Meu app';try{localStorage.setItem('applab-project',JSON.stringify(data));$('#saveBtn').textContent='✓ Salvo'}catch(e){$('#saveBtn').textContent='Não salvo';showToast('Sem espaço para salvar. Exporte o projeto.')};}
function load(){try{let d=JSON.parse(localStorage.getItem('applab-project'));if(d?.screens?.length){data=d;data.sharedValues=data.sharedValues||{};data.screens.forEach(s=>s.items.forEach(it=>{if(it.type==='input'&&!it.sharedKey)it.sharedKey=it.id}))}}catch(e){}$('#projectName').value=data.name||'Meu app';}
function cur(){return data.screens.find(s=>s.id===data.active)||data.screens[0]}function itemById(id){return cur().items.find(x=>x.id===id)}

function render(skipProps=false){renderScreens($('#screens'));canvas.innerHTML='';let s=cur();if(!s.items.length){let e=document.createElement('div');e.className='empty';e.innerHTML='<strong>Sua tela começa aqui</strong><span>Adicione um elemento e arraste para posicionar.</span>';canvas.append(e)}s.items.forEach(it=>{let el=document.createElement('div');el.className='canvas-item'+(selected===it.id&&!preview?' selected':'');el.dataset.id=it.id;el.style.left=it.x+'%';el.style.top=it.y+'%';el.style.width=it.w+'%';el.style.height=it.h+'%';el.style.background=it.type==='button'&&it.invisible?'transparent':it.color;el.style.borderRadius=it.type==='square'?'8px':it.radius+'px';el.style.color=it.textColor||'#fff';el.style.opacity=it.opacity;el.style.fontSize=it.fontSize+'px';el.style.border=it.type==='input'?'none':`${it.borderWidth||0}px solid ${it.borderColor||it.color}`;if(it.type==='image'){let im=document.createElement('img');im.src=it.src||'';el.append(im)}else if(it.type==='input'){let inp=document.createElement('input');inp.placeholder=it.placeholder||'Digite aqui';inp.readOnly=!!it.locked;inp.value=(it.sharedKey&&data.sharedValues[it.sharedKey]!==undefined)?data.sharedValues[it.sharedKey]:(it.value||'');inp.oninput=()=>{let val=inp.value,key=it.sharedKey||it.id;it.value=val;data.sharedValues[key]=val;data.screens.forEach(sc=>sc.items.forEach(other=>{if(other.type==='input'&&(other.sharedKey||other.id)===key)other.value=val}));save()};inp.style.background=it.color||'#fff';inp.style.color=it.textColor||'#172033';inp.style.fontSize=it.fontSize+'px';if(preview)inp.onpointerdown=e=>e.stopPropagation();el.append(inp)}else if(it.type==='button'){let b=document.createElement('button');b.textContent=it.label||'Botão';b.style.fontSize=it.fontSize+'px';b.style.opacity=it.invisible?'0':'1';el.append(b);if(it.target){let hit=document.createElement('div');hit.className='hit';el.append(hit)}}else if(it.type==='rect'||it.type==='square'){if(it.label){let span=document.createElement('span');span.className='item-label';span.textContent=it.label;el.append(span)}}el.onpointerdown=e=>{if(e.target.classList?.contains('resize-handle'))return;if(preview){if(it.type==='button'&&it.target){data.active=it.target;selected=null;render()}e.stopPropagation();return}beginItemGesture(e,it)};el.oncontextmenu=e=>{if(!preview){e.preventDefault();selected=it.id;render();showItemMenu(it)}};el.onclick=e=>{if(preview&&it.type==='button'&&it.target){data.active=it.target;render()}};if(!preview&&selected===it.id&&['image','rect','square','button','input'].includes(it.type)){['n','s','e','w','ne','nw','se','sw'].forEach(dir=>{let h=document.createElement('i');h.className='resize-handle';h.dataset.dir=dir;h.onpointerdown=e=>{e.stopPropagation();e.preventDefault();startResize(e,it,dir)};el.append(h)})}canvas.append(el)});phone.classList.toggle('preview',preview);if(!skipProps)renderProps();}
let holdTimer=null,holdTriggered=false;function hideItemMenu(){$('#itemMenu').classList.add('hidden')}function showItemMenu(it){let m=$('#itemMenu');m.innerHTML='';let title=document.createElement('div');title.className='item-menu-title';title.textContent=it.type==='button'?'Opções do botão':`Opções: ${it.type==='input'?'Input':it.type==='image'?'Imagem':it.type==='rect'?'Retângulo':it.type==='square'?'Quadrado':it.type}`;m.append(title);if(it.type==='button'){let label=document.createElement('label');label.className='field';label.textContent='Abrir esta tela ao tocar';let sel=document.createElement('select');sel.innerHTML='<option value="">Não navegar</option>'+data.screens.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}${s.id===cur().id?' (esta tela)':''}</option>`).join('');sel.value=it.target||'';sel.onchange=()=>{it.target=sel.value;save();showToast('Destino do botão atualizado')};label.append(sel);m.append(label)}let row=document.createElement('div');row.className='item-menu-row';let del=document.createElement('button');del.className='danger';del.textContent='Excluir item';del.onclick=()=>{cur().items=cur().items.filter(x=>x.id!==it.id);selected=null;hideItemMenu();render();save()};let close=document.createElement('button');close.textContent='Fechar';close.onclick=hideItemMenu;row.append(del,close);m.append(row);m.classList.remove('hidden')}function beginItemGesture(e,it){if(e.target.tagName==='INPUT')return;e.preventDefault();hideItemMenu();holdTriggered=false;selected=it.id;const sx=e.clientX,sy=e.clientY;let moved=false;holdTimer=setTimeout(()=>{holdTriggered=true;render();showItemMenu(it)},500);function move(ev){if(holdTriggered)return;if(Math.hypot(ev.clientX-sx,ev.clientY-sy)>7){clearTimeout(holdTimer);holdTimer=null;if(!moved){moved=true;render();let fresh=canvas.querySelector('[data-id="'+it.id+'"]');startDrag({clientX:sx,clientY:sy,pointerId:e.pointerId,preventDefault:()=>{}},it,fresh)} }}function end(){clearTimeout(holdTimer);holdTimer=null;window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',end);window.removeEventListener('pointercancel',end);if(!moved&&!holdTriggered){render();if(window.innerWidth<=800)openDrawer('props')}}window.addEventListener('pointermove',move);window.addEventListener('pointerup',end,{once:true});window.addEventListener('pointercancel',end,{once:true})}function startDrag(e,it,el){if(!el)return;hideItemMenu();e.preventDefault();const rect=canvas.getBoundingClientRect(),sx=e.clientX,sy=e.clientY,ox=it.x,oy=it.y;function move(ev){it.x=Math.max(0,Math.min(100-it.w,ox+(ev.clientX-sx)/rect.width*100));it.y=Math.max(0,Math.min(100-it.h,oy+(ev.clientY-sy)/rect.height*100));el.style.left=it.x+'%';el.style.top=it.y+'%';renderProps()}function end(){window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',end);save()}window.addEventListener('pointermove',move);window.addEventListener('pointerup',end,{once:true})}function _oldStartDrag(e,it,el){e.preventDefault();const rect=canvas.getBoundingClientRect(),sx=e.clientX,sy=e.clientY,ox=it.x,oy=it.y;el.setPointerCapture?.(e.pointerId);function move(ev){it.x=Math.max(0,Math.min(100-it.w,ox+(ev.clientX-sx)/rect.width*100));it.y=Math.max(0,Math.min(100-it.h,oy+(ev.clientY-sy)/rect.height*100));el.style.left=it.x+'%';el.style.top=it.y+'%';renderProps()}function end(){window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',end);save()}window.addEventListener('pointermove',move);window.addEventListener('pointerup',end,{once:true})}
function startResize(e,it,dir){const rect=canvas.getBoundingClientRect(),sx=e.clientX,sy=e.clientY,orig={x:it.x,y:it.y,w:it.w,h:it.h};function move(ev){let dx=(ev.clientX-sx)/rect.width*100,dy=(ev.clientY-sy)/rect.height*100;let left=dir.includes('w'),right=dir.includes('e'),top=dir.includes('n'),bottom=dir.includes('s');let x=orig.x,y=orig.y,w=orig.w,h=orig.h;if(left){x=Math.min(orig.x+orig.w-2,Math.max(0,orig.x+dx));w=orig.w+(orig.x-x)}if(right)w=Math.max(2,Math.min(100-orig.x,orig.w+dx));if(top){y=Math.min(orig.y+orig.h-2,Math.max(0,orig.y+dy));h=orig.h+(orig.y-y)}if(bottom)h=Math.max(2,Math.min(100-orig.y,orig.h+dy));it.x=x;it.y=y;it.w=w;it.h=h;render(true);save()}function end(){window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',end)}window.addEventListener('pointermove',move);window.addEventListener('pointerup',end,{once:true})}
function defaults(type){let base={id:uid(),type,x:28,y:35,w:44,h:10,color:type==='input'?'#ffffff':type==='button'?'#6c5ce7':type==='image'?'#e2e8f0':'#40c9b5',textColor:type==='input'?'#172033':'#ffffff',label:type==='button'?'Botão':'',fontSize:16,radius:10,opacity:1,borderWidth:0,borderColor:'#334155',invisible:false,target:'',placeholder:'Digite aqui',value:'',src:''};if(type==='rect'){base.w=55;base.h=20;base.label=''}if(type==='square'){base.w=28;base.h=28}if(type==='input'){base.sharedKey=base.id;base.w=70;base.h=9}if(type==='image'){base.w=45;base.h=25}return base}
function add(type){if(preview)return;$('#drawer').classList.add('hidden');let it=defaults(type);cur().items.push(it);selected=it.id;render();save();if(type==='image')$('#imagePicker').click();}
function addScreen(){let n=data.screens.length+1,s={id:uid(),name:'Tela '+n,items:[]};data.screens.push(s);data.active=s.id;selected=null;render();save();if(drawerMode)openDrawer('screens')}
function renderProps(root=$('#propsContent')){let it=itemById(selected);root.innerHTML='';if(!it){root.innerHTML='<p class="hint">Selecione um elemento na tela para editar. Arraste para mover.</p>';return}const field=(label,html)=>{let d=document.createElement('div');d.className='field';d.innerHTML=`<label>${label}</label>${html}`;root.append(d);return d.querySelector('input,select')};const text=(label,key,val)=>{let c=field(label,`<input type="text" value="${esc(val??'')}">`);c.oninput=()=>update(key,c.value)};const num=(label,key,val,min=0,max=100)=>{let c=field(label,`<input type="number" min="${min}" max="${max}" value="${val}">`);c.oninput=()=>update(key,Number(c.value))};const color=(label,key,val)=>{let c=field(label,`<input type="color" value="${validColor(val)}">`);c.oninput=()=>update(key,c.value)};const update=(k,v)=>{it[k]=v;renderCanvasOnly();save()};if(it.type==='button'||it.type==='rect'||it.type==='square')text('Texto exibido','label',it.label);if(it.type==='input'){text('Texto de exemplo','placeholder',it.placeholder);let allInputs=data.screens.flatMap(sc=>sc.items.filter(x=>x.type==='input').map(x=>({screen:sc,item:x})));let choices=allInputs.filter(({item})=>item.id!==it.id).map(({screen,item})=>{let key=item.sharedKey||item.id;let label=`${screen.name} — ${item.placeholder||'Input'}`;return `<option value="${esc(key)}">${esc(label)}</option>`}).join('');let bind=field('Compartilhar texto com input',`<select><option value="${esc(it.id)}">Não vincular</option>${choices}</select>`);bind.value=it.sharedKey||it.id;bind.onchange=()=>{it.sharedKey=bind.value;let shared=data.sharedValues[it.sharedKey];if(shared!==undefined)it.value=shared;save();renderCanvasOnly();showToast('Vínculo atualizado')};let lab=document.createElement('label');lab.className='check field';lab.innerHTML='<input type="checkbox"> Travado (somente leitura)';lab.querySelector('input').checked=!!it.locked;lab.querySelector('input').onchange=e=>update('locked',e.target.checked);root.app
