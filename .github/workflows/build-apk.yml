name: Build PicPay demo APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'picpay-visual-android-final-source.zip'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extract Android project
        run: python3 -c "import zipfile; zipfile.ZipFile('picpay-visual-android-final-source.zip').extractall('android')"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PicPay-Visual-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
