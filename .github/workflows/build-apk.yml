name: PicPay Visual — teste técnico de aviso em segundo plano
on:
  workflow_dispatch:
  push:
    paths:
      - 'PicPay-Visual-LAN-background-notifications-source-v10.zip'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Extract source
        run: |
          unzip -q PicPay-Visual-LAN-background-notifications-source-v10.zip
          ! find simulador-pix-android -type f \( -name '*.jks' -o -name '*.keystore' \) | grep .
      - name: Build checkpoint
        working-directory: simulador-pix-android
        run: bash gradlew --no-daemon --max-workers=1 assembleDebug
      - name: Verify APK
        run: |
          APK=simulador-pix-android/app/build/outputs/apk/debug/app-debug.apk
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | head -3
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          unzip -p "$APK" assets/index.html >/tmp/built-index.html
          cmp /tmp/built-index.html simulador-pix-android/app/src/main/assets/index.html
          grep -q stopLanDeviceSearch /tmp/built-index.html
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: picpay-background-internal-checkpoint
          path: simulador-pix-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
