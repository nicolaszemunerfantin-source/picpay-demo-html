name: PicPay Visual — current Android source build checkpoint
on:
  workflow_dispatch:
  push:
    paths:
      - 'PicPay-Visual-Android-source-pairing-scaffold.zip'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Extract current source tree (not legacy v6)
        run: |
          test -f PicPay-Visual-Android-source-pairing-scaffold.zip
          unzip -q PicPay-Visual-Android-source-pairing-scaffold.zip
          test -f simulador-pix-android/app/src/main/java/com/zapia/skyblock/MainActivity.java
          test ! -e simulador-pix-android/app/src/main/java/com/zapia/skyblock/MainActivity.kt
          grep -q 'versionCode = 3' simulador-pix-android/app/build.gradle.kts
      - name: Verify no signing key or Firebase secrets in source
        run: |
          test ! -e simulador-pix-android/app/google-services.json
          ! find simulador-pix-android -type f \( -name '*.jks' -o -name '*.keystore' \) | grep .
      - name: Build debug APK checkpoint only
        working-directory: simulador-pix-android
        run: bash gradlew --no-daemon --max-workers=1 assembleDebug
      - name: Record build checkpoint status
        run: |
          {
            echo '## Debug APK checkpoint'
            echo '- Built from current PicPay source. This debug build is not an install-over update and not remote-push-ready.'
            echo '- Remote sending remains disabled until secure backend setup and end-to-end validation.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: picpay-current-source-debug-apk-build-checkpoint
          path: simulador-pix-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
