name: PicPay Visual — local Wi-Fi pairing checkpoint
on:
  workflow_dispatch:
  push:
    paths:
      - 'PicPay-Visual-LAN-pairing-source-v4.zip'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Extract current source tree
        run: |
          unzip -q PicPay-Visual-LAN-pairing-source-v4.zip
          grep -q 'versionCode = 3' simulador-pix-android/app/build.gradle.kts
          ! find simulador-pix-android -type f \( -name '*.jks' -o -name '*.keystore' \) | grep .
      - name: Build debug APK checkpoint
        working-directory: simulador-pix-android
        run: bash gradlew --no-daemon --max-workers=1 assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: picpay-lan-pairing-debug-checkpoint
          path: simulador-pix-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
