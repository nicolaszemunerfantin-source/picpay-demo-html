name: PicPay Visual — local Wi-Fi pairing test APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'PicPay-Visual-LAN-pairing-source-v5.zip'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Extract current source tree
        run: |
          unzip -q PicPay-Visual-LAN-pairing-source-v5.zip
          grep -q 'versionCode = 3' simulador-pix-android/app/build.gradle.kts
          ! find simulador-pix-android -type f \( -name '*.jks' -o -name '*.keystore' \) | grep .
      - name: Build debug APK checkpoint
        working-directory: simulador-pix-android
        run: bash gradlew --no-daemon --max-workers=1 assembleDebug
      - name: Verify APK package, signature and HTML
        run: |
          APK=simulador-pix-android/app/build/outputs/apk/debug/app-debug.apk
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | head -3
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          unzip -p "$APK" assets/index.html > /tmp/built-index.html
          cmp /tmp/built-index.html simulador-pix-android/app/src/main/assets/index.html
          grep -q 'Aparelhos na mesma rede' /tmp/built-index.html
          sha256sum "$APK"
          cp "$APK" PicPay-Visual-WiFi-Teste.apk
      - uses: actions/upload-artifact@v4
        with:
          name: picpay-lan-pairing-debug-test
          path: PicPay-Visual-WiFi-Teste.apk
          if-no-files-found: error
      - name: Publish test APK for download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "wifi-teste-${{ github.run_id }}" PicPay-Visual-WiFi-Teste.apk --title 'PicPay Visual — teste Wi-Fi' --notes 'APK de depuração para testar a descoberta e solicitação de conexão na mesma rede Wi-Fi. Não testado em aparelhos. A confirmação local não permite ainda enviar notificações entre celulares; sem Pix real.' --prerelease
