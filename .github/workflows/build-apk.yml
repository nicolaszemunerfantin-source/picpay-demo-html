name: PicPay Visual — aviso de simulação por Wi-Fi
on:
  workflow_dispatch:
  push:
    paths:
      - 'PicPay-Visual-LAN-pix-notification-source-v7.zip'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Extract source
        run: |
          unzip -q PicPay-Visual-LAN-pix-notification-source-v7.zip
          ! find simulador-pix-android -type f \( -name '*.jks' -o -name '*.keystore' \) | grep .
      - name: Build APK
        working-directory: simulador-pix-android
        run: bash gradlew --no-daemon --max-workers=1 assembleDebug
      - name: Verify APK
        run: |
          APK=simulador-pix-android/app/build/outputs/apk/debug/app-debug.apk
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | head -3
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          unzip -p "$APK" assets/index.html > /tmp/built-index.html
          cmp /tmp/built-index.html simulador-pix-android/app/src/main/assets/index.html
          grep -q 'Aparelhos na mesma rede' /tmp/built-index.html
          sha256sum "$APK"
          cp "$APK" PicPay-Visual-aviso-WiFi-teste.apk
      - uses: actions/upload-artifact@v4
        with:
          name: picpay-lan-aviso-simulado-teste
          path: PicPay-Visual-aviso-WiFi-teste.apk
          if-no-files-found: error
      - name: Publish test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "aviso-wifi-teste-${{ github.run_id }}" PicPay-Visual-aviso-WiFi-teste.apk --title 'PicPay Visual — aviso Wi-Fi experimental' --notes 'APK de depuração sem teste em dois aparelhos. O envio ocorre somente na conexão ativa de rede local; usa notificação do Android, não bolha flutuante. Simulação, sem movimentação real.' --prerelease
